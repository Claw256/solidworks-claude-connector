[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
sha2 = "0.10"
walkdir = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
mtd-core = { path = "crates/mtd-core" }
mtd-index = { path = "crates/mtd-index" }
mtd-sw = { path = "crates/mtd-sw" }
mtd-claude = { path = "crates/mtd-claude" }
mtd-mcp = { path = "crates/mtd-mcp" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "process", "sync", "time"] }
